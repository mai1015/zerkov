name: Native offline raid integration
on:
  pull_request:
    paths: ['.github/workflows/native-raids.yml', 'game/world/live_maps/**', 'game/world/blackwater_crossing/**', 'game/world/northline_native/**', 'game/world/movement/**', 'game/world/navigation/**', 'game/bootstrap/local/**', 'game/raid/progression/**', 'game/combat/**', 'game/ai/vision/**', 'game/presentation/local/**', 'ui/core/local/**', 'tests/raid/live_maps*', 'tests/local/local_flow_player_driver.gd', 'tests/tooling/test_live_maps_runner.py', 'tools/run_live_maps_contracts.py', 'config/first_playable_1080_gate.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-raids-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source, original sheets and exact display policy
        run: |
          python3 tests/tooling/test_live_maps_runner.py
          python3 tests/tooling/test_ui_first_playable_scope.py
          python3 tools/check_first_playable_1080.py
          python3 tools/install_northline_native_sources.py --verify
          test ! -e tools/native_raids_stage
          test ! -e .github/workflows/publish-native-raids.yml
          git diff --check
      - name: Seal the actual tested source without copying private runtime dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/source-seal"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'source-seal'
          rows={}
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              p=root/name
              if not name or not p.is_file() or p.is_symlink():continue
              if p.suffix not in {'.gd','.tscn','.tres','.py','.json','.md','.yml','.godot'}:continue
              raw=p.read_bytes()
              rows[name]={'sha256':hashlib.sha256(raw).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
          (out/'source.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-raids-source-seal
          path: ${{ runner.temp }}/source-seal
          retention-days: 14
  native-functional:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the exact project engine on the full native host
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Verify original images and record native identity
        run: |
          mkdir -p "$RUNNER_TEMP/native-identity"
          git rev-parse HEAD > "$RUNNER_TEMP/native-identity/commit.txt"
          "$ZERKOV_GODOT" --version > "$RUNNER_TEMP/native-identity/engine.txt"
          shasum -a 256 "$ZERKOV_GODOT" config/toolchain.lock.json > "$RUNNER_TEMP/native-identity/hashes.txt"
          find addons -type f -name '*.dylib' -exec shasum -a 256 {} \; >> "$RUNNER_TEMP/native-identity/hashes.txt"
          python3 tools/install_northline_native_sources.py --verify
      - name: Actual offline extraction, death, retry, redeploy and independent restart on all maps
        run: python3 -u tools/run_live_maps_contracts.py --godot "$ZERKOV_GODOT" --output "$RUNNER_TEMP/native-raids"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-raids-functional-evidence
          path: |
            ${{ runner.temp }}/native-raids
            ${{ runner.temp }}/native-identity
          retention-days: 14
