name: Raid progression
on:
  pull_request:
    paths: ['game/**', 'tests/**', 'tools/**', 'config/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: progression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Real task, inventory, raid and settlement contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/progression-diagnostics"
          git rev-parse HEAD > "$RUNNER_TEMP/progression-diagnostics/commit.txt"
          git ls-files -z 'game/raid/progression/**' 'tests/raid/*progression*' 'tools/run_raid_progression_contracts.py' | xargs -0 shasum -a 256 > "$RUNNER_TEMP/progression-diagnostics/source-sha256.txt"
          python3 -u tools/run_raid_progression_contracts.py --godot "$ZERKOV_GODOT" --native 2>&1 | tee "$RUNNER_TEMP/progression-diagnostics/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: progression-native-diagnostics
          path: ${{ runner.temp }}/progression-diagnostics
          retention-days: 3
