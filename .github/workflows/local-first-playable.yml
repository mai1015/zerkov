name: Local first playable
on:
  pull_request:
    paths: ['game/**', 'ui/**', 'project.godot', 'tests/**', 'tools/**', 'config/**', '.github/workflows/local-first-playable.yml']
permissions:
  contents: read
concurrency:
  group: local-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-macos:
    name: native-macos (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [full, death, clock, launch]
    env:
      ZERKOV_TEST_SCENARIO: ${{ matrix.scenario }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Registration byte-idempotence
        run: python3 tests/tooling/test_registration_idempotence.py
      - name: Install exact locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Real application, isolated local files, relaunch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-flow"
          git rev-parse HEAD > "$RUNNER_TEMP/local-flow/commit.txt"
          python3 -u tools/run_local_flow_contracts.py --godot "$ZERKOV_GODOT" 2>&1 | tee "$RUNNER_TEMP/local-flow/native.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-flow-diagnostics-${{ matrix.scenario }}
          path: ${{ runner.temp }}/local-flow
          retention-days: 3
