name: Combat branch validation
on:
  push:
    branches: [codex/task-5-7-combat-input]
    paths: [.github/combat-source.patch.json]
permissions:
  contents: read
concurrency:
  group: combat-branch-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'mai1015/zerkov' && github.actor == 'mai1015' && github.ref == 'refs/heads/codex/task-5-7-combat-input'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head: ${{ steps.commit.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checked source-only patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          payload = json.loads(pathlib.Path('.github/combat-source.patch.json').read_text())
          patch = gzip.decompress(base64.b64decode(payload['patch_gzip_base64'], validate=True))
          assert len(patch) < 1000000 and hashlib.sha256(patch).hexdigest() == payload['sha256']
          paths = [line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert paths and len(paths) < 100
          prefixes = ('game/combat/', 'game/input/combat/', 'game/presentation/combat/', 'tests/combat/', 'tests/tooling/', 'tools/run_combat', 'docs/spec/changes/add-zerkov-playable-raid-2026-09-09/')
          exact = {'game/world/player/player_locomotion.gd', 'game/inventory/equipment/inventory_weapon_adapter.gd', 'ui/screens/raid/hud.gd', 'config/first_playable_1080_gate.json'}
          assert all('..' not in pathlib.PurePosixPath(p).parts and (p.startswith(prefixes) or p in exact) for p in paths)
          assert all(pathlib.Path(p).suffix in {'.gd', '.uid', '.tscn', '.tres', '.py', '.md', '.json'} for p in paths)
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '.github/combat-source.patch.json'], check=True)
          PY
      - name: Commit to the same review branch only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/task-5-7-combat-input | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'mai1015'
          git config user.email '5039212+mai1015@users.noreply.github.com'
          git commit -m 'feat(combat): apply reviewed native execution workstream changes'
          git push origin HEAD:refs/heads/codex/task-5-7-combat-input
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: apply
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.head }}
          persist-credentials: false
      - name: Install locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Native combat execution and regressions
        run: python3 tools/run_combat_input_contracts.py --godot "$ZERKOV_GODOT" --native --execution
      - name: Runner tests
        run: python3 tests/tooling/test_combat_input_runner.py
