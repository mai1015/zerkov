name: Merged game cycle audit
on:
  pull_request:
    paths: ['.github/workflows/merged-game-cycle-audit.yml', 'tests/flow_audit/**', 'docs/qa/game_cycle/**']
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cb8bc50e72b631664c9f1fb2a59ee5e84249fbae
          persist-credentials: false
      - name: Retain source and native artifact inventory, excluding artwork and fonts
        run: |
          mkdir -p "$RUNNER_TEMP/flow-source"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'flow-source'
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          records=[]
          with zipfile.ZipFile(out/'source-text.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  p=root/name
                  if not name or not p.is_file() or p.is_symlink(): continue
                  if p.suffix in {'.gd','.gdshader','.tscn','.tres','.godot','.py','.json','.md','.yml','.yaml','.gdextension','.cfg'} or name in {'.gitignore','.gitattributes'}:
                      archive.write(p,name)
                  if p.suffix in {'.so','.dylib','.dll','.gdextension'}:
                      records.append({'path':name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'native-inventory.json').write_text(json.dumps(records,indent=2)+'\n')
          (out/'commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merged-main-flow-source
          path: ${{ runner.temp }}/flow-source
          retention-days: 3
  full-native-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cb8bc50e72b631664c9f1fb2a59ee5e84249fbae
          persist-credentials: false
      - name: Install the exact project engine
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Execute original merged-main gates independently and retain failures
        run: |
          python3 -u - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys,time
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'flow-results';out.mkdir()
          env={**os.environ,'GODOT_SILENCE_ROOT_WARNING':'1','XDG_DATA_HOME':str(out/'test-user')}
          engine=env['ZERKOV_GODOT']
          ver=subprocess.check_output([engine,'--version'],text=True).strip()
          expected=json.loads((root/'config/toolchain.lock.json').read_text())['engine']['required_version']
          assert ver==expected,(ver,expected)
          (out/'engine.txt').write_text(ver+'\n'+subprocess.check_output(['uname','-a'],text=True))
          base=[engine,'--headless','--path',str(root),'--resolution','1920x1080','--audio-driver','Dummy']
          cases=[
            ('source-policy',[sys.executable,'tools/check_first_playable_1080.py'],60,None),
            ('progression-runner-unit',[sys.executable,'tests/tooling/test_raid_progression_runner.py'],60,None),
            ('editor-import',base+['--editor','--import','--quit'],180,None),
            ('progression-native',[sys.executable,'-u','tools/run_raid_progression_contracts.py','--godot',engine,'--native'],480,'RAID_PROGRESSION_RUNNER_COMPLETE mode=native'),
            ('combined-addons',base+['--script','res://tests/addons/combined_addons_smoke.gd'],90,None),
            ('production-unavailable',base+['--script','res://tests/presentation/ui_production_unavailable_8_11_contract.gd'],90,None),
            ('normal-main-smoke',base+['--','--smoke'],120,None),
            ('ui-route-smoke',base+['--script','res://tests/ui_smoke.gd'],120,None),
            ('screen-lifecycle',base+['--script','res://tests/zerkov_screen_lifecycle_contract.gd'],90,None),
          ]
          rows=[]
          for name,cmd,limit,marker in cases:
              print('AUDIT_START',name,flush=True);start=time.monotonic()
              try:
                  p=subprocess.run(cmd,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=limit)
                  text=p.stdout;code=p.returncode;timed_out=False
              except subprocess.TimeoutExpired as exc:
                  text=exc.stdout or '';text=text.decode(errors='replace') if isinstance(text,bytes) else text
                  code=124;timed_out=True
              (out/(name+'.log')).write_text(text)
              diagnostics=re.findall(r'(?m)^.*(?:SCRIPT ERROR|ERROR:|Parse Error|RUNNER_FAILED|Failed loading resource|Could not load library).*$',text)
              passed=code==0 and not diagnostics and (marker is None or marker in text)
              rows.append({'case':name,'exit':code,'passed':passed,'timeout':timed_out,'seconds':round(time.monotonic()-start,2),'diagnostics':diagnostics[:40],'completion_lines':[line for line in text.splitlines() if 'RESULT' in line or 'COMPLETE' in line]})
              (out/'results.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'engine':ver,'scope':'full checkout existing contracts; not end-to-end user flow certification','cases':rows},indent=2)+'\n')
              print('AUDIT_RESULT',json.dumps(rows[-1]),flush=True)
          sys.exit(0 if all(row['passed'] for row in rows) else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merged-main-native-flow-results
          path: |
            ${{ runner.temp }}/flow-results/*.log
            ${{ runner.temp }}/flow-results/*.json
            ${{ runner.temp }}/flow-results/*.txt
          retention-days: 7
