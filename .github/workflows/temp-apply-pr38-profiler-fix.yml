name: Apply PR38 exact-base profiler fix

on:
  push:
    branches:
      - perf/event-driven-runtime
    paths:
      - '.github/workflows/temp-apply-pr38-profiler-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-pr38-profiler-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact-base profiler patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/temp/pr38-profiler-fix.patch.gz.b64 \
            | gzip --decompress \
            > "$RUNNER_TEMP/pr38-profiler-fix.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/pr38-profiler-fix.patch"
          git rm .github/temp/pr38-profiler-fix.patch.gz.b64
          git rm .github/workflows/temp-apply-pr38-profiler-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(profile): compare exact pull-request base'
          git push origin HEAD:perf/event-driven-runtime
