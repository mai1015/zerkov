name: Offline journey UX
on:
  pull_request:
    paths: ['game/**', 'ui/**', 'tests/**', 'tools/**', 'config/**', 'docs/spec/changes/unify-offline-journey-2026-09-17/**', '.github/workflows/offline-journey.yml']
permissions:
  contents: read
concurrency:
  group: offline-journey-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive exact tracked checkout for offline reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-source"
          git rev-parse HEAD > "$RUNNER_TEMP/ux-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/ux-source/tree.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/ux-source/source.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-journey-source
          path: ${{ runner.temp }}/ux-source
          retention-days: 3
  native-ux:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json;print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Native journey and preparation return contract
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-results"
          python3 tools/run_bunker_flow_contracts.py --suite journey --godot "$ZERKOV_GODOT" --output "$RUNNER_TEMP/ux-results/run" 2>&1 | tee "$RUNNER_TEMP/ux-results/native.log"
      - name: Native contextual-loot search, open, transfer and close
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ux-results"
          python3 tools/run_bunker_flow_contracts.py --suite loot --godot "$ZERKOV_GODOT" --output "$RUNNER_TEMP/ux-results/loot" 2>&1 | tee "$RUNNER_TEMP/ux-results/loot.log"
      - name: Native equipment-dependent storage and bottom quick access
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_bunker_flow_contracts.py --suite storage --godot "$ZERKOV_GODOT" --output "$RUNNER_TEMP/ux-results/storage" 2>&1 | tee "$RUNNER_TEMP/ux-results/storage.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-journey-results
          path: ${{ runner.temp }}/ux-results
          retention-days: 7
