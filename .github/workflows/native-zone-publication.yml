name: One-time verified native map resource publication
on:
  pull_request:
    paths: ['.github/workflows/native-zone-publication.yml']
permissions:
  contents: read
jobs:
  publish-exact-resources:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/northline-native-tilemap'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Checksum-pinned native resource serializer
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Repeat exact reviewed metadata serialization, not rendering
        run: |
          python3 - <<'PY'
          import hashlib,subprocess,textwrap
          raw=subprocess.check_output(['git','show','3855f1b248d078161ce6f66b0f03db26513cf67b:.github/workflows/native-zone-publication.yml'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='015eb1e542e5405a02773d1ac5debf0cba2b9dec'
          text=raw.decode()
          start="          python3 -u - <<'PY'\n"
          assert text.count(start)==1
          code=text.split(start,1)[1].split('\n          PY\n',1)[0]
          # This immutable recipe validates every input, generates in a disposable
          # dimensions-only workspace, then requires all 40 exact original-art
          # resource hashes before staging. No PNGs or placeholders are published.
          exec(compile(textwrap.dedent(code),'<reviewed-metadata-publication>','exec'))
          PY
      - name: Verify retained freight and complete native map source
        run: |
          python3 -m unittest discover -s tests/tooling -p test_northline_native_zone.py -v
          python3 -m unittest discover -s tests/tooling -p test_northline_native_sources.py -v
          python3 tests/tooling/test_ui_first_playable_scope.py
          python3 tools/check_first_playable_1080.py
          git diff --cached --check
      - name: Guarded fast-forward on the approved branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch=feat/northline-native-tilemap
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD -- .github/workflows assets project.godot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(maps): save the nine-district native TileMap world and verified resource references'
          git push origin "HEAD:refs/heads/$branch"
