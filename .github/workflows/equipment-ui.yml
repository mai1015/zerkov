name: Equipment UI
on:
  pull_request:
    paths: ['game/**', 'ui/**', 'tests/**', 'tools/**', '.github/workflows/equipment-ui.yml']
permissions:
  contents: read
concurrency:
  group: equipment-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact native Linux reproduction packet
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          allowed = {'.gd', '.uid', '.tscn', '.tres', '.json', '.py', '.md', '.gdextension', '.yml', '.yaml', '.png', '.webp', '.jpg', '.jpeg', '.svg', '.ttf', '.otf', '.so'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'equipment-runtime.zip'
          hashes = {}
          total = 0
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink(): continue
                  if not (path.suffix in allowed or name == 'project.godot'): continue
                  data = path.read_bytes()
                  total += len(data)
                  archive.writestr(name, data)
                  hashes[name] = hashlib.sha256(data).hexdigest()
              archive.writestr('REPRODUCTION_COMMIT', subprocess.check_output(['git', 'rev-parse', 'HEAD']))
              archive.writestr('REPRODUCTION_SHA256.json', json.dumps(hashes, sort_keys=True))
          print('EQUIPMENT_REPRODUCTION files=',len(hashes),'bytes=',total,'zip_bytes=',output.stat().st_size)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equipment-runtime
          path: ${{ runner.temp }}/equipment-runtime.zip
          retention-days: 1
