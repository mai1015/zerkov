name: Normal launch input probe
on:
  pull_request:
    paths: ['.github/workflows/normal-launch-flow.yml', 'tests/presentation/normal_launch_probe.gd']
permissions:
  contents: read
jobs:
  normal-launch:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Confirm production code is the audited main revision
        run: git diff --exit-code cb8bc50e72b631664c9f1fb2a59ee5e84249fbae -- game ui addons assets project.godot
      - name: Install exact native engine
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Import full checkout and dispatch actual title/menu input
        run: |
          python3 -u - <<'PY'
          import json,os,pathlib,re,subprocess,sys
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'normal-launch';out.mkdir()
          env={**os.environ,'GODOT_SILENCE_ROOT_WARNING':'1','FLOW_AUDIT_OUTPUT':str(out/'observation.json')}
          engine=env['ZERKOV_GODOT'];version=subprocess.check_output([engine,'--version'],text=True).strip()
          assert version==json.loads((root/'config/toolchain.lock.json').read_text())['engine']['required_version']
          base=[engine,'--headless','--path',str(root),'--resolution','1920x1080','--audio-driver','Dummy']
          def run(name,cmd,timeout):
              try:
                  p=subprocess.run(cmd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
                  text=p.stdout;code=p.returncode
              except subprocess.TimeoutExpired as exc:
                  text=exc.stdout or '';text=text.decode(errors='replace') if isinstance(text,bytes) else text;code=124
              (out/(name+'.log')).write_text(text);print(text,flush=True)
              errors=re.findall(r'(?m)^.*(?:SCRIPT ERROR|ERROR:|Parse Error).*$',text)
              if code not in (0,2) or errors: raise RuntimeError((name,code,errors[:10]))
              return code
          run('import',base+['--editor','--import','--quit'],150)
          driver=out/'driver.gd'
          driver.write_text('''extends SceneTree
          func _initialize() -> void:
              call_deferred("run")
          func run() -> void:
              root.size = Vector2i(1920, 1080)
              create_timer(30.0).timeout.connect(func(): push_error("NORMAL_LAUNCH_WATCHDOG"); quit(1))
              var suite = load("res://tests/presentation/normal_launch_probe.gd").new()
              var result: Dictionary = await suite.run(self)
              var target = FileAccess.open(OS.get_environment("FLOW_AUDIT_OUTPUT"), FileAccess.WRITE)
              if target == null:
                  push_error("NORMAL_LAUNCH_RESULT_WRITE_FAILED")
                  quit(1)
                  return
              target.store_string(JSON.stringify(result, "  "))
              target.close()
              quit(1 if result["failures"] > 0 else (0 if result["game_cycle_complete"] else 2))
          ''')
          code=run('normal-launch',base+['--script',str(driver)],60)
          report=json.loads((out/'observation.json').read_text())
          report['source_commit']='cb8bc50e72b631664c9f1fb2a59ee5e84249fbae'
          report['engine']=version; report['engine_exit']=code
          (out/'observation.json').write_text(json.dumps(report,indent=2)+'\n')
          print('NORMAL_LAUNCH_OBSERVATION',json.dumps(report),flush=True)
          # A verified blocker is intentionally not a green full-cycle result.
          sys.exit(0 if report['game_cycle_complete'] and report['failures']==0 else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normal-launch-input-observation
          path: |
            ${{ runner.temp }}/normal-launch/*.log
            ${{ runner.temp }}/normal-launch/*.json
            ${{ runner.temp }}/normal-launch/driver.gd
          retention-days: 7
