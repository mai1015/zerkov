name: Raid handler CPU profile
on:
  pull_request:
    paths: ['game/**', 'tools/profile_raid_handlers.py', '.github/workflows/raid-handler-profile.yml']
permissions:
  contents: read
concurrency:
  group: handler-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Control and instrumented production ticks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handler-profile"
          git rev-parse HEAD > "$RUNNER_TEMP/handler-profile/commit.txt"
          python3 -u tools/profile_raid_handlers.py --godot "$ZERKOV_GODOT" 2>&1 | tee "$RUNNER_TEMP/handler-profile/native.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: raid-handler-profile
          path: ${{ runner.temp }}/handler-profile
          retention-days: 3
