name: Raid handler CPU profile
on:
  pull_request:
    paths: ['game/**', 'tests/combat/health_catalog*', 'tests/tooling/test_health_catalog_runner.py', 'tools/run_health_catalog_contracts.py', 'tools/profile_raid_handlers.py', '.github/workflows/raid-handler-profile.yml']
permissions:
  contents: read
concurrency:
  group: handler-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Package isolated local reproduction bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          git archive --format=zip --output="$RUNNER_TEMP/zerkov-source.zip" HEAD
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot-linux.zip"
          {
            git rev-parse HEAD
            shasum -a 256 "$RUNNER_TEMP/zerkov-source.zip" "$RUNNER_TEMP/godot-linux.zip"
          } > "$RUNNER_TEMP/local-repro-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raid-local-repro
          path: |
            ${{ runner.temp }}/zerkov-source.zip
            ${{ runner.temp }}/godot-linux.zip
            ${{ runner.temp }}/local-repro-sha256.txt
          retention-days: 1
      - name: Package unchanged Linux runtime for isolated reproduction
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, zipfile
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'raid-linux-runtime.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in pathlib.Path('addons').rglob('*.so'):
                  archive.write(path)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raid-linux-runtime
          path: ${{ runner.temp }}/raid-linux-runtime.zip
          retention-days: 1
      - name: Install locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Record source and unchanged runtime identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handler-profile"
          git rev-parse HEAD > "$RUNNER_TEMP/handler-profile/commit.txt"
          sw_vers > "$RUNNER_TEMP/handler-profile/hardware.txt"
          sysctl -n machdep.cpu.brand_string >> "$RUNNER_TEMP/handler-profile/hardware.txt"
          shasum -a 256 config/toolchain.lock.json "$ZERKOV_GODOT" > "$RUNNER_TEMP/handler-profile/runtime-sha256.txt"
          find addons -type f -name '*.dylib' -exec shasum -a 256 {} \; >> "$RUNNER_TEMP/handler-profile/runtime-sha256.txt"
          python3 tests/tooling/test_health_catalog_runner.py
      - name: Native health catalog differential and preflight timings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handler-profile"
          python3 -u tools/run_health_catalog_contracts.py --godot "$ZERKOV_GODOT" 2>&1 | tee "$RUNNER_TEMP/handler-profile/health-catalog.log"
      - name: Control and instrumented production ticks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handler-profile"
          git rev-parse HEAD > "$RUNNER_TEMP/handler-profile/commit.txt"
          python3 -u tools/profile_raid_handlers.py --godot "$ZERKOV_GODOT" --baseline-ref "${{ github.event.pull_request.base.sha }}" 2>&1 | tee "$RUNNER_TEMP/handler-profile/native.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: raid-handler-profile
          path: ${{ runner.temp }}/handler-profile
          retention-days: 3
