name: Offline bunker integration
on:
  pull_request:
    paths: ['.github/workflows/offline-bunker.yml', 'tools/offline_candidate.patch', 'game/offline/**', 'game/bootstrap/offline_application*', 'ui/**', 'tests/presentation/offline_bunker_flow.gd', 'tests/tooling/*offline_bunker*', 'project.godot', 'config/first_playable_1080_gate.json']
permissions:
  contents: read
jobs:
  native-offline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/offline-bunker-entry'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply explicit reviewed correction with Git preimage checks
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if test -f tools/offline_candidate.patch; then
            git apply --check --index tools/offline_candidate.patch
            git apply --index tools/offline_candidate.patch
            git rm -- tools/offline_candidate.patch
            git diff --cached --check
            actual=$(git ls-remote origin refs/heads/feat/offline-bunker-entry | cut -f1)
            test "$actual" = "$EXPECTED_HEAD"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(offline): apply native integration correction'
            git push origin HEAD:refs/heads/feat/offline-bunker-entry
          fi
      - name: Verify exact-output registration
        run: |
          python3 tests/tooling/test_ui_first_playable_scope.py
          python3 tools/check_first_playable_1080.py
          git diff --check
      - name: Install exact native engine
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Real offline startup, inventory, failure handling and independent Continue process
        run: python3 -u tests/tooling/run_offline_bunker_gate.py --godot "$ZERKOV_GODOT" --output "$RUNNER_TEMP/offline-headless"
      - name: Configure an exact native capture display on the ephemeral CI host
        run: |
          cat > "$RUNNER_TEMP/offline-display.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let screen = CGMainDisplayID()
          let options = [kCGDisplayShowDuplicateLowResolutionModes: true] as CFDictionary
          let modes = (CGDisplayCopyAllDisplayModes(screen, options) as? [CGDisplayMode]) ?? []
          for mode in modes {
              print("DISPLAY_MODE logical=\(mode.width)x\(mode.height) pixels=\(mode.pixelWidth)x\(mode.pixelHeight)")
          }
          guard let selected = modes.first(where: { $0.width == 1920 && $0.height == 1080 && $0.pixelWidth == 1920 && $0.pixelHeight == 1080 }) else {
              print("OFFLINE_DISPLAY_BLOCKED: no exact non-HiDPI 1920x1080 mode")
              exit(2)
          }
          let result = CGDisplaySetDisplayMode(screen, selected, nil)
          guard result == .success else {
              print("OFFLINE_DISPLAY_BLOCKED: configuration failed \(result.rawValue)")
              exit(2)
          }
          guard let current = CGDisplayCopyDisplayMode(screen), current.pixelWidth == 1920 && current.pixelHeight == 1080 else { exit(2) }
          print("OFFLINE_DISPLAY_READY 1920x1080")
          SWIFT
          swift "$RUNNER_TEMP/offline-display.swift"
      - name: Native graphical bunker and inventory capture
        run: python3 -u tests/tooling/run_offline_bunker_gate.py --godot "$ZERKOV_GODOT" --output "$RUNNER_TEMP/offline-graphical" --graphical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-bunker-native-results
          path: |
            ${{ runner.temp }}/offline-headless
            ${{ runner.temp }}/offline-graphical
          retention-days: 7
