name: Combat contracts
on:
  pull_request:
    paths:
      - 'game/combat/**'
      - 'game/input/combat/**'
      - 'game/presentation/**'
      - 'game/world/player/**'
      - 'game/inventory/equipment/**'
      - 'ui/screens/raid/hud.gd'
      - 'tests/combat/**'
      - 'tests/tooling/test_combat*'
      - 'tools/run_combat*'
      - 'config/toolchain.lock.json'
      - '.github/workflows/combat-contracts.yml'
permissions:
  contents: read
concurrency:
  group: combat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/tooling/test_combat_input_runner.py
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source revision
        run: |
          git rev-parse HEAD
          shasum -a 256 tests/combat/native_combat_execution_contract.gd
      - name: Install exact locked engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("config/toolchain.lock.json"))["engine"]["required_version"].split(".stable.")[0])')
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          echo "ZERKOV_GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Real authority and combat execution contracts
        run: python3 tools/run_combat_input_contracts.py --godot "$ZERKOV_GODOT" --native --execution
