name: Publish reviewed native-raid merge resolution
on:
  push:
    branches: ['feat/offline-native-raids']
    paths: ['tools/live_merge_transport/**', '.github/workflows/finish-native-raids.yml']
permissions:
  contents: read
jobs:
  exact-source-publication:
    if: github.repository == 'mai1015/zerkov' && github.ref == 'refs/heads/feat/offline-native-raids'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply only sealed source changes and verify exact outputs
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,re,subprocess,tempfile
          root=pathlib.Path.cwd();transport=root/'tools/live_merge_transport'
          if not transport.exists():
              print('REVIEWED_MERGE_ALREADY_PUBLISHED');raise SystemExit(0)
          chunks=[transport/('%02d.b64'%i) for i in range(4)]
          raw=base64.b64decode(''.join(p.read_text().strip() for p in chunks),validate=True)
          assert len(raw)==28496 and hashlib.sha256(raw).hexdigest()=='d6b8c4d300d4a662dbd814b84b6fbc6582b4866296ee3094fd91dcd3862046b6'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          decoded=decoder.decompress(raw,max_length=114453)
          assert decoder.eof and not decoder.unused_data and len(decoded)==114452
          assert hashlib.sha256(decoded).hexdigest()=='0b2245c747cff32d7a3af900fbfcf416ccd7aedd2197681e78eecee289ec93e3'
          data=json.loads(decoded);assert data['schema']==1 and len(data['files'])==30
          assert not subprocess.check_output(['git','status','--porcelain'],text=True)
          for name,seal in data['files'].items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
              assert name.startswith(('game/','ui/','tests/','tools/','config/','docs/'))
              assert p.suffix in {'.gd','.uid','.py','.tscn','.tres','.json','.md'}
              target=root/name;assert not target.is_symlink()
              before=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              assert before==seal['before'],name
          def apply(patch):
              with tempfile.NamedTemporaryFile(suffix='.patch') as tmp:
                  tmp.write(patch);tmp.flush()
                  subprocess.run(['git','apply','--check',tmp.name],check=True)
                  subprocess.run(['git','apply',tmp.name],check=True)
          apply(data['patch'].encode())
          for name,seal in data['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==seal['after'],name
          patch=(transport/'treatment.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='8b1bfb450d1799cef6527823ea685b8d92ad0b3d180662fd3abce2c996505bb3'
          player=root/'tests/local/local_flow_player_driver.gd'
          assert hashlib.sha256(player.read_bytes()).hexdigest()=='0392af44ef66423fe12f10d464243e447cf0614e6405fc14f5fb35e1ed61172e'
          apply(patch)
          assert hashlib.sha256(player.read_bytes()).hexdigest()=='99e38614cba93a463e021866c181c2097131e1e5db2953a90e5e5cde8e4fc6c5'
          changed=set(subprocess.check_output(['git','ls-files','--modified','--others','--exclude-standard'],text=True).splitlines())
          assert changed==set(data['files']),(changed-set(data['files']),set(data['files'])-changed)
          for command in [['python3','tests/tooling/test_live_maps_runner.py'],['python3','tests/tooling/test_ui_first_playable_scope.py'],['python3','tools/check_first_playable_1080.py'],['python3','tools/install_northline_native_sources.py','--verify']]:subprocess.run(command,check=True)
          subprocess.run(['git','add','--',*data['files']],check=True)
          subprocess.run(['git','rm','-r','--','tools/live_merge_transport'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('REVIEWED_NATIVE_MAP_MERGE files=30 asset_changes=0 addon_changes=0 workflow_changes=0')
          PY
      - name: Fast-forward only this authorized branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          branch=feat/offline-native-raids
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD -- .github/workflows assets addons project.godot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(raids): preserve merged preparation UI and validate interrupted search treatment'
          git push origin "HEAD:refs/heads/$branch"
