        fill="none" stroke="#FFFFFF" stroke-width="1.5"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M6 12 H20 M16 8 L20 12 L16 16"
        fill="none" stroke="#FFFFFF" stroke-width="1.5"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
